name: BalloonBot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: balloonbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BalloonBot.csproj

      - name: Build
        run: dotnet build BalloonBot.csproj --configuration Release --no-restore

      - name: Run BalloonBot
        env:
          WOLF_TOKEN: ${{ secrets.WOLF_TOKEN }}
          WOLF_EMAIL: ${{ secrets.WOLF_EMAIL }}
          WOLF_PASSWORD: ${{ secrets.WOLF_PASSWORD }}
        run: dotnet run --project BalloonBot.csproj --configuration Release --no-build
