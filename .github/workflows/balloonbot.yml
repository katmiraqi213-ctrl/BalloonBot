name: BalloonBot

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: balloonbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BalloonBot.csproj

      - name: Build
        run: dotnet build BalloonBot.csproj --configuration Release --no-restore

      - name: Check Secrets
        env:
          WOLF_EMAIL: ${{ secrets.WOLF_EMAIL }}
          WOLF_PASSWORD: ${{ secrets.WOLF_PASSWORD }}
        run: |
          if [ -z "$WOLF_EMAIL" ]; then
            echo "❌ WOLF_EMAIL غير موجود"
            exit 1
          else
            echo "✅ WOLF_EMAIL موجود"
          fi

          if [ -z "$WOLF_PASSWORD" ]; then
            echo "❌ WOLF_PASSWORD غير موجود"
            exit 1
          else
            echo "✅ WOLF_PASSWORD موجود"
          fi

      - name: Run BalloonBot
        env:
          WOLF_EMAIL: ${{ secrets.WOLF_EMAIL }}
          WOLF_PASSWORD: ${{ secrets.WOLF_PASSWORD }}
        run: dotnet run --project BalloonBot.csproj --configuration Release --no-build
