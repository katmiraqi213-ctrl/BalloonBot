      - name: Check Secrets
        env:
          WOLF_EMAIL_BALLOON: ${{ secrets.WOLF_EMAIL_BALLOON }}
          WOLF_PASSWORD_BALLOON: ${{ secrets.WOLF_PASSWORD_BALLOON }}
        run: |
          if [ -z "$WOLF_EMAIL_BALLOON" ]; then
            echo "❌ WOLF_EMAIL_BALLOON غير موجود"
          else
            echo "✅ WOLF_EMAIL_BALLOON موجود"
          fi

          if [ -z "$WOLF_PASSWORD_BALLOON" ]; then
            echo "❌ WOLF_PASSWORD_BALLOON غير موجود"
          else
            echo "✅ WOLF_PASSWORD_BALLOON موجود"
          fi

      - name: Run BalloonBot
        env:
          WOLF_EMAIL_BALLOON: ${{ secrets.WOLF_EMAIL_BALLOON }}
          WOLF_PASSWORD_BALLOON: ${{ secrets.WOLF_PASSWORD_BALLOON }}
        run: dotnet run --project BalloonBot.csproj --configuration Release --no-build
